<!DOCTYPE html>
<html>

<head>
    <title>Suma y Multiplicación</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: cyan;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input[type="text"] {
            width: 100px;
            padding: 5px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Suma y Multiplicación de Números</h1>

        <label for="numero1">Ingrese el primer número:</label>
        <input type="text" id="numero1" value="5">

        <label for="numero2">Ingrese el segundo número:</label>
        <input type="text" id="numero2" value="12">

        <button onclick="calcular()">Calcular</button>

        <p id="resultados"></p>
    </div>

    <script src="sum_mult.js"></script>
</body>

</html>
